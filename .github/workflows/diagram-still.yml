name: Diagram Still

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render-still:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate ELK layouts
        run: npm run diagram:layout

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render RAG basic still
        run: npx remotion still ArchitectureDiagramStill out/rag-basic.png

      - name: Render AWS serverless still
        run: npx remotion still AwsServerlessStill out/aws-serverless.png

      - name: Render RAG system still
        run: npx remotion still RagSystemStill out/rag-system.png

      - name: Upload diagram artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagram-stills
          path: |
            out/rag-basic.png
            out/aws-serverless.png
            out/rag-system.png
