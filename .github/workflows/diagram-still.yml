name: Diagram Still

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render-still:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate ELK layout
        run: npm run diagram:layout

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render architecture still
        run: npx remotion still ArchitectureDiagramStill out/rag-diagram.png

      - name: Upload diagram artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-diagram-still
          path: out/rag-diagram.png
