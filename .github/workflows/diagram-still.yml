name: Diagram Still

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render-still:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate ELK layouts
        run: npm run diagram:layout
      - name: Ensure browser
        run: npx remotion browser ensure
      - name: Typecheck
        run: npm run typecheck
      - name: Render diagram stills
        run: |
          mkdir -p out
          npx remotion still ArchitectureDiagramStill out/rag-basic.png
          npx remotion still AwsServerlessStill out/aws-serverless.png
          npx remotion still RagSystemStill out/rag-system.png
      - name: Render scene library stills
        run: |
          npx remotion still TerminalPanelStill out/terminal-panel.png
          npx remotion still DirectoryTreeStill out/directory-tree.png
          npx remotion still GitTreeStill out/git-tree.png
          npx remotion still MetricDashboardStill out/metric-dashboard.png
          npx remotion still ComparisonTableStill out/comparison-table.png
      - name: Upload still artifacts
        uses: actions/upload-artifact@v4
        with:
          name: technical-scene-stills
          path: out/*.png
