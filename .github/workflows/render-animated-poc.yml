name: Render Animated PoC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/templates/ArchitectureDiagramAnimated/**"
      - "src/Root.tsx"
      - "narration/**"
      - "scripts/generate-guide-audio.py"
      - ".github/workflows/render-animated-poc.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Install current piper-plus Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/ayutaz/piper-plus.git@dev#subdirectory=src/python_run"
          echo "PIPER_PLUS_BIN=piper-plus" >> "$GITHUB_ENV"

      - name: Download Japanese voice model
        run: |
          piper-plus --download-model css10

      - name: Generate Japanese narration
        env:
          PIPER_PLUS_MODEL: css10-ja-6lang-fp16.onnx
        run: python scripts/generate-guide-audio.py

      - name: Generate ELK layouts
        run: npm run diagram:layout

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render animated serverless PoC with Japanese narration
        run: npx remotion render AwsServerlessAnimated out/aws-serverless-animated-ja-css10.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-serverless-animated-ja-css10
          path: out/aws-serverless-animated-ja-css10.mp4
