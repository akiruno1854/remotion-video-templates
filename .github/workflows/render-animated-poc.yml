name: Render Animated PoC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/templates/ArchitectureDiagramAnimated/**"
      - "src/Root.tsx"
      - "narration/**"
      - "scripts/generate-guide-audio.py"
      - ".github/workflows/render-animated-poc.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install guide voice generator
        run: sudo apt-get update && sudo apt-get install -y espeak

      - name: Generate guide narration
        run: python3 scripts/generate-guide-audio.py

      - name: Generate ELK layouts
        run: npm run diagram:layout

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render animated serverless PoC with narration
        run: npx remotion render AwsServerlessAnimated out/aws-serverless-animated-with-audio.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-serverless-animated-with-audio
          path: out/aws-serverless-animated-with-audio.mp4
