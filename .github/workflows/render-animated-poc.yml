name: Render Animated PoC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/templates/ArchitectureDiagramAnimated/**"
      - "src/Root.tsx"
      - "narration/**"
      - "scripts/generate-guide-audio.py"
      - ".github/workflows/render-animated-poc.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm install

      - name: Install piper-plus binary
        run: |
          curl -L -o piper.tar.gz https://github.com/ayutaz/piper-plus/releases/download/v1.8.2/piper-linux-x64.tar.gz
          tar xzf piper.tar.gz
          chmod +x piper/bin/piper
          echo "PIPER_PLUS_BIN=$PWD/piper/bin/piper" >> "$GITHUB_ENV"

      - name: Download Japanese voice model
        run: |
          "$PIPER_PLUS_BIN" --download-model tsukuyomi

      - name: Generate Japanese narration
        env:
          PIPER_PLUS_MODEL: tsukuyomi
        run: python scripts/generate-guide-audio.py

      - name: Generate ELK layouts
        run: npm run diagram:layout

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render animated serverless PoC with Japanese narration
        run: npx remotion render AwsServerlessAnimated out/aws-serverless-animated-ja.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-serverless-animated-ja
          path: out/aws-serverless-animated-ja.mp4
