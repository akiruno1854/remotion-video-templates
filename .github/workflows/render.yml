name: Render Short

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition id to render
        required: false
        default: ArchitectureDiagramShort
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render composition
        run: npx remotion render ${{ github.event.inputs.composition || 'ArchitectureDiagramShort' }} out/video.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
